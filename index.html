<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventline</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <img class="side-logo" src="assets/tabler_chart-dots-3-filled.svg" alt="Eventline" />
    </div>

    <nav class="side-nav">
      <button class="nav-btn active" id="navEvents" title="Event view">
        <span class="nav-icon">◈</span>
        <span class="nav-label">Events</span>
      </button>
      <button class="nav-btn" id="navMap" title="World view">
        <span class="nav-icon">◎</span>
        <span class="nav-label">World</span>
      </button>
      <button class="nav-btn" id="navDays" title="Browse days">
        <span class="nav-icon">▦</span>
        <span class="nav-label">Days</span>
      </button>
    </nav>

    <div class="side-bottom">
      <button class="nav-btn" id="themeBtn" title="Theme">
        <span class="nav-icon">◐</span>
        <span class="nav-label">Theme</span>
      </button>
      <div id="themeMenu" class="theme-menu hidden">
        <button data-theme="dark">Dark</button>
        <button data-theme="dark-blue">Dark blue</button>
        <button data-theme="white">White</button>
        <button data-theme="cyberpunk">Cyberpunk</button>
        <button data-theme="retro">Dark retro</button>
        <button data-theme="pink">Dark pink</button>
        <button data-theme="gray">Light gray</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="header">
      <div class="header-left">
        <div class="brand-row">
          <div class="brand">eventline</div>
        </div>
        <div class="tagline">World events. Mapped to stocks.</div>
      </div>
      <div class="header-right">
        <div id="meta" class="meta">—</div>
      </div>
    </header>

    <div id="boot" class="boot">
      <div class="boot-title">Analyzing world events...</div>
      <div id="bootLog" class="boot-log"></div>
    </div>

    <div id="dayBar" class="day-bar hidden">
      <button id="prevDay" class="day-btn">← Older</button>
      <div id="dayLabel" class="day-label">Latest</div>
      <button id="nextDay" class="day-btn">Newer →</button>
    </div>

    <div id="status" class="status"></div>

    <div id="eventsView" class="view"></div>

    <div id="mapView" class="view hidden">
      <div id="map" class="map"></div>
      <div id="countryPanel" class="country-panel"></div>
      <div id="countryArticles" class="country-articles"></div>
      <div id="relatedClusters" class="related-clusters"></div>
    </div>

    <div id="daysView" class="view hidden"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/themes.js"></script>
<script src="js/map.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
